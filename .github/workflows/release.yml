# Builds the Windows installer and publishes it as a GitHub release when a version tag is pushed:
#   git tag v1.1
#   git push origin v1.1
# The release gets ProjecteP1-setup.exe, which the README's download button points to (releases/latest).

name: Release installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and attach the setup

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The runner also has newer SDKs, and dotnet picks the newest: with it the Windows projection of
      # net8.0-windows10.0.19041.0 generates unsafe code and the build fails. Build with the .NET 8 SDK, as on our PCs
      # (pinned here only, so nobody's local setup is affected)
      - name: Use the .NET 8 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the setup
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Projecte P1 ${{ github.ref_name }}
          files: installer/output/ProjecteP1-setup.exe
          body: |
            Windows installer for Projecte P1 (Trajectory Entries and Sector Demand).

            1. Download **ProjecteP1-setup.exe** below and run it.
            2. Windows may say "Windows protected your PC" because the setup is not signed: click **More info > Run anyway**.
            3. Start **Projecte P1** from the Start menu and choose **Load Data > Default data**.

            Installs for your user only (no administrator rights) and includes everything it needs. Windows 10 or 11, 64-bit; internet for the map imagery. Remove it from Settings > Apps.
